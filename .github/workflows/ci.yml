name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - run: bun test src/index.test.ts src/client.test.ts src/config.test.ts src/metrics.test.ts src/normalize.test.ts --coverage --coverage-reporter=lcov --coverage-reporter=text
      - run: npx tsc --noEmit
      - uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          fail_ci_if_error: false

  adapter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapter
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: adapter -> target
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  integration:
    needs: [test, adapter-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Clone harness repo
        run: git clone --depth 1 https://github.com/sondera-ai/sondera-coding-agent-hooks.git /tmp/harness
      - name: Build harness server
        run: cargo build --bin sondera-harness-server
        working-directory: /tmp/harness
      - name: Build adapter
        run: cargo build --bin sondera-opencode-adapter
        working-directory: adapter
      - name: Install plugin deps
        run: bun install
      - name: "Diagnostic - test adapter against harness"
        run: |
          rm -rf ~/.sondera && mkdir -p ~/.sondera
          /tmp/harness/target/debug/sondera-harness-server --policy-path /tmp/harness/policies --verbose &> $HOME/harness-output.log &
          HARNESS_PID=$!
          for i in $(seq 1 30); do
            [ -S ~/.sondera/sondera-harness.sock ] && break
            sleep 1
          done
          echo "=== Socket exists ==="
          ls -la ~/.sondera/sondera-harness.sock
          echo "=== Health check ==="
          echo '{}' | timeout 15 "$ADAPTER_BIN" health 2>&1 || echo "health exit code: $?"
          echo "=== Allow request ==="
          echo '{"tool":"bash","action":"ShellCommand","trajectory_id":"diag-allow-1","agent_id":"diag","args":{"command":"ls /tmp"},"cwd":"/tmp"}' | timeout 15 "$ADAPTER_BIN" adjudicate 2>&1
          echo "=== Deny request ==="
          echo '{"tool":"bash","action":"ShellCommand","trajectory_id":"diag-deny-2","agent_id":"diag","args":{"command":"rm -rf /"},"cwd":"/tmp"}' | timeout 15 "$ADAPTER_BIN" adjudicate 2>&1
          echo "=== Harness stderr (last 200 lines) ==="
          tail -200 $HOME/harness-output.log || echo "(no output captured)"
          echo "=== Killing harness ==="
          kill $HARNESS_PID 2>/dev/null
          wait $HARNESS_PID 2>/dev/null || true
        env:
          ADAPTER_BIN: ${{ github.workspace }}/adapter/target/debug/sondera-opencode-adapter
          RUST_LOG: debug
          RUST_BACKTRACE: full
      - name: Run integration tests
        run: bun test src/integration.test.ts --timeout 30000
        env:
          SONDERA_HARNESS_REPO: /tmp/harness
          SONDERA_ADAPTER_BIN: ${{ github.workspace }}/adapter/target/debug/sondera-opencode-adapter
